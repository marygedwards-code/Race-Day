<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start to Finish 
    Race Day Schedule</title>

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Comfortaa', sans-serif;
      background-color: Red;
      color: black;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: Black;
      font-size: 42px;
      font-weight: bold;
    }

    label {
      font-size: 22px;
      font-weight: bold;
    }

    input {
      margin-top: 15px;
      padding: 12px;
      font-size: 18px;
      border: 2px solid darkred;
      border-radius: 8px;
      font-family: 'Comfortaa', sans-serif;
    }

    ul {
      text-align: left;
      display: inline-block;
      margin-top: 30px;
      font-size: 20px;
      line-height: 1.8;
    }

    .time {
      font-weight: bold;
    }

    #flyers {
      color: Black;
      font-size: 38px;
      font-weight: bold;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <h1>Start to Finish Race Day Schedule</h1>

  <label for="raceTime">Race start time?</label><br>
  <input type="time" id="raceTime" />

  <div id="schedule"></div>

  <script>
    const raceTimeInput = document.getElementById("raceTime");
    const scheduleDiv = document.getElementById("schedule");

    raceTimeInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        generateSchedule();
      }
    });

    function subtractTime(time, hours, minutes) {
      let [hour, minute] = time.split(":").map(Number);
      let date = new Date();
      date.setHours(hour);
      date.setMinutes(minute);

      date.setHours(date.getHours() - hours);
      date.setMinutes(date.getMinutes() - minutes);

      return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function generateSchedule() {
      const raceTime = raceTimeInput.value;

      if (!raceTime) {
        scheduleDiv.innerHTML = "<p>Please enter a race start time.</p>";
        return;
      }

      const mealStart = subtractTime(raceTime, 4, 30);
      const mealEnd = subtractTime(raceTime, 3, 30);
      const shakeout = subtractTime(raceTime, 4, 0);
      const snackStart = subtractTime(raceTime, 3, 30);
      const snackEnd = subtractTime(raceTime, 3, 0);
      const bicarb = subtractTime(raceTime, 2, 30);
      const warmup = subtractTime(raceTime, 1, 0);

      scheduleDiv.innerHTML = `
        <ul>
          <li><span class="time">${mealStart} - ${mealEnd}</span>: Eat meal.</li>
          <li><span class="time">${shakeout}</span>: Shakeout run.</li>
          <li><span class="time">${snackStart} - ${snackEnd}</span>: Eat snack.</li>
          <li><span class="time">${bicarb}</span>: Consume bicarb (If applicable) and drink 32 oz of water.</li>
          <li><span class="time">${warmup}</span>: Warm up.</li>
        </ul>
        <div id="flyers">GO FLYERS! ✈️</div>
      `;
    }
  </script>
</body>
</html>
